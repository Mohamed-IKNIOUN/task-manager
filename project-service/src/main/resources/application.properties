spring.application.name=project-service

server.port=8081

# Database configuration
#spring.datasource.url=jdbc:postgresql://localhost:5432/task_manager
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/task_manager
spring.datasource.username=taskadmin
spring.datasource.password=taskpassword
