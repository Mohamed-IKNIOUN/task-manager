services:

  postgres:
    image: postgres:18
    container_name: task-manager-db
    environment:
      POSTGRES_USER: taskadmin
      POSTGRES_PASSWORD: taskpassword
      POSTGRES_DB: task_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskadmin -d task_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  project-service:
    build: ./project-service
    container_name: project-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task_manager
      SPRING_DATASOURCE_USERNAME: taskadmin
      SPRING_DATASOURCE_PASSWORD: taskpassword
    depends_on:
      postgres:
        condition: service_healthy

  task-service:
    build: ./task-service
    container_name: task-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task_manager
      SPRING_DATASOURCE_USERNAME: taskadmin
      SPRING_DATASOURCE_PASSWORD: taskpassword
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: